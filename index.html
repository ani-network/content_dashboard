<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ani Network — Content Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#100E17;
    --surface:#1B1826;
    --surface-2:#241F33;
    --surface-3:#2C2640;
    --border:#332C49;
    --border-soft:#241F33;
    --text:#F2F0F7;
    --text-muted:#948FAA;
    --text-faint:#615C77;

    --accent-anime:#FF5E8A;
    --accent-game:#3FD9C7;
    --accent-vtuber:#B18CFF;
    --accent-comic:#FFC24B;
    --accent-live:#FF3B5C;

    --radius:14px;
    --radius-sm:9px;

    --font-display:'Bebas Neue', 'Noto Sans Thai', sans-serif;
    --font-body:'Inter', 'Noto Sans Thai', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(ellipse 1200px 600px at 15% -10%, rgba(177,140,255,0.14), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 0%, rgba(63,217,199,0.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; }

  :focus-visible{
    outline:2px solid var(--accent-vtuber);
    outline-offset:2px;
    border-radius:4px;
  }

  /* ---------- Header / Masthead ---------- */
  header.masthead{
    padding:28px clamp(16px,4vw,40px) 0;
    max-width:1600px;
    margin:0 auto;
  }
  .masthead-row{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }
  .wordmark{
    display:flex;
    align-items:baseline;
    gap:14px;
  }
  .wordmark h1{
    font-family:var(--font-display);
    font-size:clamp(38px,6vw,54px);
    letter-spacing:0.03em;
    margin:0;
    line-height:0.9;
    background:linear-gradient(120deg, #FF5E8A 0%, #B18CFF 55%, #3FD9C7 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .wordmark .tag{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--text-faint);
    border:1px solid var(--border);
    padding:4px 9px;
    border-radius:100px;
    white-space:nowrap;
  }
  .masthead-sub{
    font-size:13.5px;
    color:var(--text-muted);
    margin-top:4px;
  }

  .stat-strip{
    display:flex;
    gap:22px;
    font-family:var(--font-mono);
  }
  .stat-strip .stat{ text-align:right; }
  .stat-strip .stat .num{
    font-size:22px;
    font-weight:700;
    color:var(--text);
    line-height:1;
  }
  .stat-strip .stat .lbl{
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-top:3px;
  }

  /* ---------- Sync banner ---------- */
  .sync-banner{
    max-width:1600px;
    margin:14px auto 0;
    padding:0 clamp(16px,4vw,40px);
  }
  .sync-banner .inner{
    display:flex; align-items:center; gap:9px;
    font-size:12.5px;
    padding:9px 14px;
    border-radius:100px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
  }
  .sync-banner.error .inner{ border-color:var(--accent-live); color:var(--accent-live); }
  .sync-banner.ok .inner{ border-color:var(--accent-game); color:var(--accent-game); }
  .sync-banner .spin{
    width:11px; height:11px; border-radius:50%;
    border:2px solid currentColor; border-top-color:transparent;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- Toolbar ---------- */
  .toolbar{
    max-width:1600px;
    margin:20px auto 0;
    padding:0 clamp(16px,4vw,40px);
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .search-box{
    position:relative;
    flex:1;
    min-width:200px;
    max-width:320px;
  }
  .search-box svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    color:var(--text-faint);
  }
  .search-box input{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:100px;
    padding:9px 14px 9px 34px;
    color:var(--text);
    font-size:13.5px;
  }
  .search-box input::placeholder{ color:var(--text-faint); }

  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-muted);
    font-size:12.5px;
    font-weight:500;
    padding:7px 13px;
    border-radius:100px;
    transition:border-color .15s, color .15s, background .15s;
  }
  .chip .dot-cat{ width:7px; height:7px; border-radius:50%; }
  .chip[aria-pressed="true"]{
    color:var(--text);
    border-color:var(--chip-color, var(--border));
    background:color-mix(in srgb, var(--chip-color, var(--surface)) 16%, var(--surface));
  }
  .chip:hover{ color:var(--text); }

  .status-seg{
    display:flex;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:100px;
    padding:3px;
    gap:2px;
  }
  .status-seg button{
    background:transparent;
    border:none;
    color:var(--text-muted);
    font-size:12px;
    font-weight:500;
    padding:6px 12px;
    border-radius:100px;
  }
  .status-seg button[aria-pressed="true"]{
    background:var(--surface-3);
    color:var(--text);
  }

  .spacer{ flex:1; }

  .btn-add{
    display:inline-flex; align-items:center; gap:7px;
    background:color-mix(in srgb, var(--accent-vtuber) 14%, var(--surface));
    border:1px solid color-mix(in srgb, var(--accent-vtuber) 55%, var(--border));
    color:var(--text);
    font-weight:700;
    font-size:12.5px;
    padding:9px 15px;
    border-radius:100px;
    white-space:nowrap;
  }
  .btn-add:hover{
    background:color-mix(in srgb, var(--accent-vtuber) 24%, var(--surface));
    border-color:var(--accent-vtuber);
  }

  /* ---------- Layout: feed + workspace ---------- */
  .layout{
    max-width:1600px;
    margin:22px auto 60px;
    padding:0 clamp(16px,4vw,40px);
    display:grid;
    grid-template-columns:minmax(400px, 560px) 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width:920px){
    .layout{ grid-template-columns:1fr; }
  }

  .feed-panel{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:calc(100vh - 240px);
    overflow-y:auto;
    padding-right:4px;
  }
  .feed-panel::-webkit-scrollbar{ width:7px; }
  .feed-panel::-webkit-scrollbar-thumb{ background:var(--surface-3); border-radius:100px; }

  .empty-hint{
    font-size:12.5px;
    color:var(--text-faint);
    text-align:center;
    padding:30px 12px;
    border:1px dashed var(--border);
    border-radius:var(--radius-sm);
  }

  /* ---------- News card (feed) ---------- */
  .news-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 15px 12px;
    cursor:pointer;
    transition:border-color .15s, transform .1s, background .15s;
  }
  .news-card:hover{ border-color:var(--surface-3); }
  .news-card.selected{
    border-color:var(--accent-vtuber);
    background:color-mix(in srgb, var(--accent-vtuber) 8%, var(--surface));
  }
  .news-card.drafted{ opacity:0.72; }

  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }
  .cat-badge{
    display:inline-flex; align-items:center; gap:5px;
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:3px 8px 3px 6px;
    border-radius:100px;
  }
  .cat-badge .dot-cat{ width:6px; height:6px; border-radius:50%; }

  .status-pill{
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--text-faint);
  }

  .card-title{
    font-size:13.5px;
    font-weight:600;
    line-height:1.4;
    margin:0 0 5px;
  }
  .card-summary{
    font-size:12px;
    color:var(--text-muted);
    line-height:1.5;
    margin:0 0 10px;
  }
  .news-card .card-summary{
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--text-faint);
    border-top:1px solid var(--border-soft);
    padding-top:8px;
  }
  .card-meta .src{ color:var(--text-muted); }
  .card-meta .src-link{
    color:var(--accent-vtuber);
    text-decoration:none;
    display:inline-flex; align-items:center; gap:3px;
  }
  .card-meta .src-link:hover{ text-decoration:underline; }

  .icon-btn{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-muted);
    width:24px; height:24px;
    border-radius:7px;
    display:inline-flex; align-items:center; justify-content:center;
    flex:none;
  }
  .icon-btn:hover{ color:var(--accent-live); border-color:var(--accent-live); }

  /* ---------- Workspace panel ---------- */
  .workspace{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px;
    min-height:400px;
  }

  .ws-empty{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    min-height:400px;
    color:var(--text-faint);
  }
  .ws-empty svg{ margin-bottom:14px; opacity:0.5; }
  .ws-empty p{ font-size:13.5px; max-width:280px; line-height:1.6; }

  .ws-selected-card{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:14px 16px;
    margin-bottom:20px;
  }
  .ws-selected-card .txt{ flex:1; }
  .ws-selected-card .card-title{ font-size:15px; margin-bottom:4px; }
  .ws-selected-card .card-summary{ margin-bottom:0; }
  .link-btn{
    background:transparent;
    border:none;
    color:var(--accent-vtuber);
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
    padding:4px 0;
  }
  .link-btn:hover{ text-decoration:underline; }

  .tone-row{
    display:flex; gap:8px; flex-wrap:wrap;
    margin-bottom:16px;
  }
  .tone-chip{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-muted);
    font-size:12px;
    font-weight:500;
    padding:7px 13px;
    border-radius:100px;
  }
  .tone-chip:hover{ color:var(--text); border-color:var(--surface-3); }
  .tone-chip.active{
    color:#100E17;
    background:linear-gradient(120deg, var(--accent-anime), var(--accent-vtuber));
    border-color:transparent;
    font-weight:700;
  }

  .img-gallery{
    display:flex; gap:10px; flex-wrap:wrap;
    margin-bottom:10px;
  }
  .img-thumb{
    width:84px; height:84px;
    border-radius:var(--radius-sm);
    border:2px solid var(--border);
    overflow:hidden;
    cursor:pointer;
    background:var(--surface-2);
    flex:none;
    position:relative;
  }
  .img-thumb img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .img-thumb.selected{ border-color:var(--accent-comic); }
  .img-slot-badge{
    position:absolute; top:3px; left:3px;
    width:20px; height:20px;
    border-radius:50%;
    background:var(--accent-comic);
    color:#100E17;
    font-size:11px;
    font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .img-remove{
    position:absolute; top:3px; right:3px;
    width:20px; height:20px;
    border-radius:50%;
    background:rgba(11,10,17,0.75);
    border:1px solid rgba(255,255,255,0.2);
    color:#fff;
    font-size:13px;
    line-height:1;
    display:flex; align-items:center; justify-content:center;
    padding:0;
  }
  .img-remove:hover{ background:var(--accent-live); border-color:var(--accent-live); }
  .img-thumb.none-tile{
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:4px;
    color:var(--text-faint);
    font-size:10.5px;
    text-align:center;
    padding:6px;
  }
  .img-thumb.none-tile.selected{ border-color:var(--accent-comic); color:var(--accent-comic); }
  .img-thumb.paste-zone{
    display:block;
    color:var(--text-faint);
    font-size:9.5px;
    text-align:center;
    padding:26px 6px;
    border-style:dashed;
    cursor:pointer;
    resize:none;
    font-family:inherit;
    line-height:1.4;
  }
  .img-thumb.paste-zone::placeholder{ color:var(--text-faint); text-align:center; }
  .img-thumb.paste-zone:focus{
    outline:none;
    border-color:var(--accent-vtuber);
    color:var(--accent-vtuber);
  }
  .img-thumb.paste-zone:focus{
    outline:none;
    border-color:var(--accent-vtuber);
    color:var(--accent-vtuber);
  }
  .img-selected-info{
    display:flex; align-items:center; gap:10px;
    font-size:12px;
    color:var(--text-muted);
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:9px 12px;
    margin-bottom:16px;
  }
  .img-selected-info a{ color:var(--accent-vtuber); text-decoration:none; }
  .img-selected-info a:hover{ text-decoration:underline; }

  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:11.5px;
    font-weight:600;
    color:var(--text-muted);
    margin-bottom:6px;
    letter-spacing:0.02em;
  }
  .field textarea, .field input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    color:var(--text);
    font-size:13px;
    line-height:1.6;
    resize:vertical;
  }
  .field textarea.style-input{ min-height:64px; }
  .field textarea.article-input{ min-height:180px; }

  .btn-generate{
    display:inline-flex; align-items:center; gap:8px;
    background:linear-gradient(120deg, var(--accent-anime), var(--accent-vtuber));
    color:#100E17;
    font-weight:700;
    font-size:13.5px;
    border:none;
    padding:11px 20px;
    border-radius:100px;
  }
  .btn-generate:hover{ filter:brightness(1.08); }
  .btn-generate:disabled{ opacity:0.55; pointer-events:none; }
  .btn-generate .spin{
    width:13px; height:13px; border-radius:50%;
    border:2px solid #100E17; border-top-color:transparent;
    animation:spin 0.7s linear infinite;
  }

  .gen-error{
    margin-top:12px;
    font-size:12.5px;
    color:var(--accent-live);
    background:color-mix(in srgb, var(--accent-live) 10%, transparent);
    border:1px solid color-mix(in srgb, var(--accent-live) 35%, transparent);
    border-radius:var(--radius-sm);
    padding:11px 14px;
    line-height:1.6;
  }

  .card-canvas-wrap{
    background:
      repeating-conic-gradient(#211D2E 0% 25%, #1B1826 0% 50%) 50% / 20px 20px;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:12px;
    display:flex;
    justify-content:center;
    margin-bottom:10px;
  }
  .card-canvas-wrap canvas{
    width:100%;
    max-width:280px;
    height:auto;
    border-radius:6px;
    display:block;
  }
  .btn-download{
    display:inline-flex; align-items:center; gap:7px;
    width:100%;
    justify-content:center;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    font-weight:600;
    font-size:13px;
    padding:10px 16px;
    border-radius:100px;
  }
  .btn-download:hover{ border-color:var(--accent-comic); color:var(--accent-comic); }

  .divider{
    border:none;
    border-top:1px solid var(--border-soft);
    margin:22px 0;
  }

  .headline-options{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .headline-opt{
    display:flex;
    align-items:flex-start;
    gap:10px;
    text-align:left;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:11px 13px;
    font-size:13.5px;
    line-height:1.5;
    color:var(--text-muted);
  }
  .headline-opt:hover{ border-color:var(--surface-3); }
  .headline-opt.picked{
    border-color:var(--accent-comic);
    background:color-mix(in srgb, var(--accent-comic) 10%, var(--surface-2));
    color:var(--text);
  }
  .headline-opt .radio{
    width:15px; height:15px; border-radius:50%;
    border:2px solid var(--border);
    flex:none; margin-top:2px;
  }
  .headline-opt.picked .radio{
    border-color:var(--accent-comic);
    background:radial-gradient(circle, var(--accent-comic) 0 40%, transparent 42%);
  }

  .hook-box{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:14px 16px;
    font-size:14px;
    line-height:1.7;
    font-style:italic;
    color:var(--text);
  }

  .field-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:6px;
  }
  .field-head label{ margin-bottom:0; }
  .copy-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-faint);
    font-size:10.5px;
    padding:3px 9px;
    border-radius:100px;
    display:inline-flex; align-items:center; gap:4px;
  }
  .copy-btn:hover{ color:var(--text); border-color:var(--surface-3); }

  .ws-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
  }
  .btn-secondary{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-muted);
    padding:10px 16px;
    border-radius:100px;
    font-size:13px;
    font-weight:600;
  }
  .btn-secondary:hover{ color:var(--text); border-color:var(--surface-3); }
  .btn-accent{
    background:color-mix(in srgb, var(--accent-vtuber) 14%, var(--surface-2));
    border:1px solid color-mix(in srgb, var(--accent-vtuber) 55%, var(--border));
    color:var(--text);
    font-weight:700;
    padding:9px 15px;
    border-radius:100px;
    font-size:13px;
  }
  .btn-accent:hover{
    background:color-mix(in srgb, var(--accent-vtuber) 24%, var(--surface-2));
    border-color:var(--accent-vtuber);
  }
  .btn-primary-outline{
    background:transparent;
    border:1px solid var(--accent-game);
    color:var(--accent-game);
    padding:10px 16px;
    border-radius:100px;
    font-size:13px;
    font-weight:700;
  }
  .btn-primary-outline:hover{ background:color-mix(in srgb, var(--accent-game) 12%, transparent); }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(8,7,13,0.72);
    backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius);
    width:100%; max-width:440px;
    padding:22px;
  }
  .modal h2{
    font-family:var(--font-display);
    font-size:24px;
    letter-spacing:0.02em;
    margin:0 0 16px;
  }
  .modal .field select{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:9px 11px;

  async function fetchItemsFromSheet(){
    const res = await fetch(SHEET_API_URL);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'โหลดข้อมูลไม่สำเร็จ');
    return data.items.map(function(row){
      let imgs = [];
      try { imgs = JSON.parse(row.images || '[]'); } catch(e){ imgs = []; }
      return {
        id: String(row.id),
        category: row.category,
        status: row.status || 'new',
        title: row.title,
        summary: row.summary,
        source: row.source,
        url: row.url || '',
        images: imgs,
        timestamp: row.timestamp,
        article: null,
      };
    });
  }

  async function postToSheet(payload){
    if (!SHEET_API_URL) return null;
    try {
      const res = await fetch(SHEET_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
      });
      return await res.json();
    } catch (err) {
      showBanner('error', 'เชื่อมต่อ backend ไม่สำเร็จ: ' + err.message);
      return null;
    }
  }

  }

  /* ---------- แยกข้อมูลจากคำตอบที่วางกลับมาจาก Claude.ai ---------- */
  function parsePastedResponse(text){
    function grab(label, nextLabels){
      const pattern = new RegExp(label + '\\s*:?\\s*([\\s\\S]*?)(?=' + nextLabels.join('|') + '|$)', 'i');
      const m = text.match(pattern);
      return m ? m[1].trim() : '';
    }
    const h1 = grab('HEADLINE\\s*1', ['HEADLINE\\s*2']);
    const h2 = grab('HEADLINE\\s*2', ['HEADLINE\\s*3']);
    const h3 = grab('HEADLINE\\s*3', ['HOOK']);
    const hook = grab('HOOK', ['ARTICLE']);
    const article = grab('ARTICLE', ['$^']); // ไปจนจบข้อความ

    const headlines = [h1, h2, h3].filter(Boolean);

    if (headlines.length === 0 && !hook && !article){
      // แยกรูปแบบไม่สำเร็จ — เก็บข้อความทั้งหมดไว้ในช่องบทความแทน ไม่ให้ข้อมูลหาย
      return { headlines:['(กรุณาระบุหัวข้อเอง)'], hook:'(กรุณาระบุ hook เอง)', article:text.trim() };
    }

    return {
      headlines: headlines.length ? headlines : ['(กรุณาระบุหัวข้อเอง)'],
      hook: hook || '(กรุณาระบุ hook เอง)',
      article: article || text.trim(),
    };
  }

  function getActiveHeadline(){
    if (customHeadlineText !== null) return customHeadlineText;
    return genResult ? genResult.headlines[pickedHeadlineIdx] : '';
  }

  function showBanner(type, text){
    const el = document.getElementById('sync-banner');
    el.hidden = false;
    el.className = 'sync-banner' + (type ? ' ' + type : '');
    el.innerHTML = '<div class="inner">' + (type === 'loading' ? '<span class="spin"></span>' : '') + text + '</div>';
    if (type === 'ok'){ setTimeout(function(){ el.hidden = true; }, 2500); }
  }

  function id(){ return 'itm-' + (++counter); }

  let activeStatusFilter = 'all';

  let selectedImageUrls = []; // เรียงตามลำดับที่คลิกเลือก = ลำดับช่องใน layout

  async function initItems(){
    const footer = document.getElementById('footer-note');
    if (!SHEET_API_URL){
      items = loadInitialItems();
      return;
    }
    showBanner('loading', 'กำลังโหลดข้อมูลจาก Google Sheet...');
    try {
      items = await fetchItemsFromSheet();
      document.getElementById('sync-banner').hidden = true;
      footer.textContent = '🟢 เชื่อมต่อกับ Google Sheet แล้ว — การเปลี่ยนแปลงทั้งหมดจะถูกบันทึกลงชีตจริง';
    } catch (err) {
      items = loadInitialItems();
      showBanner('error', 'เชื่อมต่อ Google Sheet ไม่สำเร็จ กำลังแสดงข้อมูลจำลองแทน');
      footer.textContent = '⚠ เชื่อมต่อ Google Sheet ไม่สำเร็จ (' + err.message + ') — กำลังแสดงข้อมูลตัวอย่างชั่วคราว';
    }
  }

  function minsSince(ts){ return Math.max(0, Math.floor((Date.now() - new Date(ts).getTime()) / 60000)); }
  function timeAgo(ts){
    const mins = minsSince(ts);
    if (mins < 1) return 'เมื่อสักครู่';
    if (mins < 60) return mins + ' นาทีที่แล้ว';
    const h = Math.floor(mins / 60);
    if (h < 24) return h + ' ชม.ที่แล้ว';
    return Math.floor(h / 24) + ' วันที่แล้ว';
  }
  function catMeta(catId){ return CATEGORIES[catId] || { label:catId, color:'var(--text-muted)' }; }
  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }

  function filteredItems(){
    return items
      .filter(function(it){
        if (activeCategory !== 'all' && it.category !== activeCategory) return false;
        if (activeStatusFilter !== 'all' && it.status !== activeStatusFilter) return false;
        if (searchTerm){
          const hay = (it.title + ' ' + it.summary + ' ' + it.source).toLowerCase();
          if (!hay.includes(searchTerm)) return false;
        }
        return true;
      })
      .sort(function(a,b){ return minsSince(a.timestamp) - minsSince(b.timestamp); });
  }

  /* ---------- render: chips + status seg ---------- */
  function renderChips(){
    const row = document.getElementById('chip-row');
    row.innerHTML = '';
    row.appendChild(makeChip('all', 'ทั้งหมด', null));
    Object.entries(CATEGORIES).forEach(function(pair){
      row.appendChild(makeChip(pair[0], pair[1].label, pair[1].color));
    });

    const seg = document.getElementById('status-seg');
    seg.innerHTML = '';
    STATUS_FILTERS.forEach(function(sf){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = sf.label;
      btn.setAttribute('aria-pressed', activeStatusFilter === sf.id ? 'true' : 'false');
      btn.addEventListener('click', function(){ activeStatusFilter = sf.id; renderAll(); });
      seg.appendChild(btn);
    });
  }

  function makeChip(catId, label, color){
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.type = 'button';
    btn.setAttribute('aria-pressed', activeCategory === catId ? 'true' : 'false');
    if (color) btn.style.setProperty('--chip-color', color);
    btn.innerHTML = (color ? '<span class="dot-cat" style="background:' + color + '"></span>' : '') + label;
    btn.addEventListener('click', function(){ activeCategory = catId; renderAll(); });
    return btn;
  }

  /* ---------- render: stats ---------- */
  function renderStats(){
    document.getElementById('stat-total').textContent = items.length;
    document.getElementById('stat-drafted').textContent = items.filter(function(it){ return it.status === 'drafted'; }).length;
    document.getElementById('stat-posted').textContent = items.filter(function(it){ return it.status === 'posted'; }).length;
  }

  /* ---------- render: feed ---------- */
  function renderFeed(){
    const panel = document.getElementById('feed-panel');
    panel.innerHTML = '';
    const visible = filteredItems();

    if (visible.length === 0){
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = 'ไม่พบข่าวที่ตรงกับเงื่อนไข';
      panel.appendChild(hint);
      return;
    }

    visible.forEach(function(it){ panel.appendChild(renderNewsCard(it)); });
  }

  function renderNewsCard(it){
    const meta = catMeta(it.category);
    const card = document.createElement('div');
    card.className = 'news-card' + (it.id === selectedId ? ' selected' : '') + (it.status === 'drafted' || it.status === 'posted' ? ' drafted' : '');
    card.tabIndex = 0;
    card.setAttribute('role', 'button');

    const srcHtml = it.url
      ? '<a class="src-link" href="' + escapeHtml(it.url) + '" target="_blank" rel="noopener">' + escapeHtml(it.source) + ' ↗</a>'
      : '<span class="src">' + escapeHtml(it.source) + '</span>';

    card.innerHTML =
      '<div class="card-top">' +
        '<span class="cat-badge" style="color:' + meta.color + '; background:color-mix(in srgb, ' + meta.color + ' 16%, transparent); border:1px solid color-mix(in srgb, ' + meta.color + ' 35%, transparent);">' +
          '<span class="dot-cat" style="background:' + meta.color + '"></span>' + meta.label +
        '</span>' +
        '<span class="status-pill">' + STATUS_LABEL[it.status] + '</span>' +
      '</div>' +
      '<p class="card-title">' + escapeHtml(it.title) + '</p>' +
      '<p class="card-summary">' + escapeHtml(it.summary) + '</p>' +
      '<div class="card-meta">' +
        srcHtml +
        '<span>' + timeAgo(it.timestamp) + '</span>' +
      '</div>';

    card.addEventListener('click', function(){ selectItem(it.id); });
    card.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); selectItem(it.id); }
    });

    return card;
  }

            selectedImageUrls.splice(existingIdx, 1); // คลิกซ้ำ = เอาออก

  function copyText(text, btnEl){
    navigator.clipboard.writeText(text).then(function(){

  /* ---------- สร้างภาพ Headline Card ด้วย Canvas (พื้นด้านบนโปร่งใส) ---------- */
  const CATEGORY_HEX = { anime:'#FF5E8A', game:'#3FD9C7', vtuber:'#B18CFF', comic:'#FFC24B' };

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ---------- ระบบไฮไลต์ headline แบบอิสระ (markup **...**) ---------- */
  const HIGHLIGHT_COLOR = '#FFD400';

  function parseHeadlineMarkup(text){
    const tokens = [];
    let i = 0;
    let hi = false;
    while (i < text.length){
      if (text.slice(i, i + 2) === '**'){
        hi = !hi;
        i += 2;
        continue;
      }
      tokens.push({ ch: text[i], hi: hi });
      i++;
    }
    return tokens;
  }

  function stripHighlightMarkup(text){
    return (text || '').split('**').join('');
  }

  function wrapRichHeadline(ctx, tokens, x, startY, maxWidth, lineHeight, maxLines, normalFont, highlightFont){
    function tokenWidth(tok){
      ctx.font = tok.hi ? highlightFont : normalFont;
      return ctx.measureText(tok.ch).width;
    }

    const lines = [];
    let currentLine = [];
    let currentWidth = 0;

    for (let idx = 0; idx < tokens.length; idx++){
      const tok = tokens[idx];
      const w = tokenWidth(tok);
      if (currentWidth + w > maxWidth && currentLine.length > 0){
        lines.push(currentLine);
        currentLine = [];
        currentWidth = 0;
        if (lines.length >= maxLines) break;
      }
      currentLine.push(tok);
      currentWidth += w;
    }
    if (lines.length < maxLines && currentLine.length) lines.push(currentLine);

    const usedCount = lines.reduce(function (sum, l) { return sum + l.length; }, 0);
    if (lines.length === maxLines && usedCount < tokens.length && lines[maxLines - 1].length){
      let last = lines[maxLines - 1];
      while (last.length > 0){
        const testLine = last.concat([{ ch: '…', hi: last[last.length - 1].hi }]);
        let testWidth = 0;
        testLine.forEach(function (t) { testWidth += tokenWidth(t); });
        if (testWidth <= maxWidth) { last = testLine; break; }
        last = last.slice(0, -1);
      }
      lines[maxLines - 1] = last;
    }

    lines.forEach(function (line, li){
      let cx = x;
      let i = 0;
      while (i < line.length){
        const hi = line[i].hi;
        let j = i;
        let runText = '';
        while (j < line.length && line[j].hi === hi){
          runText += line[j].ch;
          j++;
        }
        ctx.font = hi ? highlightFont : normalFont;
        ctx.fillStyle = hi ? HIGHLIGHT_COLOR : '#FFFFFF';
        ctx.fillText(runText, cx, startY + li * lineHeight);
        cx += ctx.measureText(runText).width;
        i = j;
      }
    });

    return lines.length;
  }

  function wrapTextCanvas(ctx, text, x, y, maxWidth, lineHeight, maxLines){
    const chars = Array.from(text);
    let line = '';
    let lines = [];
    for (let i = 0; i < chars.length; i++){
      const test = line + chars[i];
      if (ctx.measureText(test).width > maxWidth && line !== ''){
        lines.push(line);
        line = chars[i];
        if (lines.length >= maxLines) break;
      } else {
        line = test;
      }
    }
    if (lines.length < maxLines && line) lines.push(line);
    if (lines.length === maxLines && Array.from(lines[maxLines-1] + line).length < chars.length){
      // ตัดคำสุดท้ายให้เหลือที่ใส่ ... ถ้าเนื้อหายังไม่จบ
      let last = lines[maxLines-1];
      while (ctx.measureText(last + '…').width > maxWidth && last.length > 0){
        last = last.slice(0, -1);
      }
      lines[maxLines-1] = last + '…';
    }
    lines.forEach(function(l, i){ ctx.fillText(l, x, y + i * lineHeight); });
    return lines.length;
  }

  function drawCoverImage(ctx, img, x, y, w, h){
    const scale = Math.max(w / img.width, h / img.height);
    const dw = img.width * scale, dh = img.height * scale;
    const dx = x + (w - dw) / 2, dy = y + (h - dh) / 2;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.restore();
  }

  function loadImageForCanvas(url){
    return new Promise(function(resolve){
      if (!url){ resolve(null); return; }
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function(){ resolve(img); };
      img.onerror = function(){ resolve(null); };
      img.src = url;
    });
  }

  let loadedHeadlineImgs = [];
  let loadedHeadlineImgsKey = undefined;
  function ensureHeadlineImagesLoaded(callback){
    const key = JSON.stringify(selectedImageUrls);
    if (key === loadedHeadlineImgsKey){
      callback(loadedHeadlineImgs);
      return;
    }
    Promise.all(selectedImageUrls.map(loadImageForCanvas)).then(function(imgs){
      loadedHeadlineImgs = imgs;
      loadedHeadlineImgsKey = key;
      callback(imgs);
    });
  }

  function getLayoutSlots(layout, topW, topH){
    const gap = 6;
    if (layout === '2'){
      const w = (topW - gap) / 2;
      return [
        { x:0, y:0, w:w, h:topH },
        { x:w + gap, y:0, w:w, h:topH },
      ];
    }
    if (layout === '3'){
      const bigW = topW * 0.62;
      const smallW = topW - bigW - gap;
      const smallH = (topH - gap) / 2;
      return [
        { x:0, y:0, w:bigW, h:topH },
        { x:bigW + gap, y:0, w:smallW, h:smallH },
        { x:bigW + gap, y:smallH + gap, w:smallW, h:smallH },
      ];
    }
    return [{ x:0, y:0, w:topW, h:topH }]; // '1'
  }

  function renderHeadlineCanvas(canvas, headlineText, category, layout, loadedImgs){
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const color = CATEGORY_HEX[category] || '#B18CFF';

    ctx.clearRect(0, 0, W, H); // พื้นบนปล่อยโปร่งใสไว้ ถ้าไม่มีรูป

    const barH = Math.round(H * 0.33);
    const barY = H - barH;

    // วาดรูปตามช่องของ layout (ช่องไหนไม่มีรูป/โหลดไม่สำเร็จ ปล่อยโปร่งใส)
    const slots = getLayoutSlots(layout, W, barY);
    slots.forEach(function(slot, i){
      const img = loadedImgs ? loadedImgs[i] : null;
      if (img) drawCoverImage(ctx, img, slot.x, slot.y, slot.w, slot.h);
    });

    // แถบดำด้านล่าง
    ctx.fillStyle = '#0B0A11';
    ctx.fillRect(0, barY, W, barH);

    // badge เปลี่ยนข้อความตามหมวดข่าว ไล่สีชมพู-ม่วง คาบรอยต่อระหว่างพื้นที่โปร่งใสกับแถบดำ
    ctx.font = '800 30px "Noto Sans Thai", sans-serif';
    const badgePadX = 30;
    const badgeText = (catMeta(category).label || 'NEWS').toUpperCase();
    const badgeTextW = ctx.measureText(badgeText).width;
    const badgeW = badgeTextW + badgePadX * 2;
    const badgeH = 64;
    const badgeX = 48;
    const badgeY = barY - badgeH / 2; // ครึ่งบนโผล่เหนือแถบดำ ครึ่งล่างจมอยู่ในแถบดำ

    const grad = ctx.createLinearGradient(badgeX, 0, badgeX + badgeW, 0);
    grad.addColorStop(0, '#FF5E8A');
    grad.addColorStop(1, '#B18CFF');
    ctx.fillStyle = grad;
    roundRect(ctx, badgeX, badgeY, badgeW, badgeH, badgeH / 2);
    ctx.fill();

    ctx.fillStyle = '#FFFFFF';
    ctx.textBaseline = 'middle';
    ctx.fillText(badgeText, badgeX + badgePadX, badgeY + badgeH / 2 + 2);

    // headline — รองรับไฮไลต์บางส่วนด้วย markup **...** (สีเหลือง+ตัวใหญ่กว่า)
    ctx.textBaseline = 'alphabetic';
    const normalFont = '700 50px "Noto Sans Thai", sans-serif';
    const highlightFont = '800 60px "Noto Sans Thai", sans-serif';
    const headlineTokens = parseHeadlineMarkup(headlineText);
    wrapRichHeadline(ctx, headlineTokens, 48, badgeY + badgeH + 70, W - 96, 76, 3, normalFont, highlightFont);

    // แถบไล่สีบางๆ ที่ขอบล่างสุดของภาพ
    const stripH = 10;
    const stripGrad = ctx.createLinearGradient(0, 0, W, 0);
    stripGrad.addColorStop(0, '#FF5E8A');
    stripGrad.addColorStop(0.5, '#B18CFF');
    stripGrad.addColorStop(1, '#3FD9C7');
    ctx.fillStyle = stripGrad;
    ctx.fillRect(0, H - stripH, W, stripH);

    // แถวไอคอนโซเชียล + แบรนด์ เหนือแถบไล่สีเล็กน้อย
    const iconY = H - stripH - 58;
    const iconR = 22;
    const label = 'Ani เมาะ';
    const groups = [
      { bg:'#1877F2', glyph:'f', glyphSize:22 },
      { bg:'#0F1419', glyph:'X', glyphSize:22 },
      { gradient:true, glyph:'IG', glyphSize:15 },
    ];
    ctx.font = '600 22px "Inter", "Noto Sans Thai", sans-serif';
    const labelW = ctx.measureText(label).width;
    const groupGap = 34;
    const groupW = iconR * 2 + 12 + labelW;
    const totalW = groupW * groups.length + groupGap * (groups.length - 1);
    let gx = (W - totalW) / 2;

    groups.forEach(function(g){
      ctx.beginPath();
      ctx.arc(gx + iconR, iconY, iconR, 0, Math.PI * 2);
      if (g.gradient){
        const igGrad = ctx.createLinearGradient(gx, iconY - iconR, gx + iconR * 2, iconY + iconR);
        igGrad.addColorStop(0, '#FEDA75');
        igGrad.addColorStop(0.3, '#FA7E1E');
        igGrad.addColorStop(0.55, '#D62976');
        igGrad.addColorStop(0.8, '#962FBF');
        igGrad.addColorStop(1, '#4F5BD5');
        ctx.fillStyle = igGrad;
      } else {
        ctx.fillStyle = g.bg;
      }
      ctx.fill();

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 ' + g.glyphSize + 'px "Inter", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(g.glyph, gx + iconR, iconY + 1);
      ctx.textAlign = 'left';

      ctx.fillStyle = '#C8C4D6';
      ctx.font = '600 22px "Inter", "Noto Sans Thai", sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, gx + iconR * 2 + 12, iconY + 1);

      gx += groupW + groupGap;
    });
  }

  function downloadCanvasPng(canvas, filename){
    canvas.toBlob(function(blob){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/png');
  }

  async function fetchArticleMetaFromBackend(url){
    if (!SHEET_API_URL){
      throw new Error('ยังไม่ได้เชื่อมต่อ Google Apps Script backend — ดู setup-guide.md');
    }
    const res = await fetch(SHEET_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'fetchMeta', url:url }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'ดึงข้อมูลไม่สำเร็จ');
    return data.result; // { title, summary, image, siteName }
  }

  function hostnameOf(url){
    try { return new URL(url).hostname.replace(/^www\./, ''); }
    catch(e){ return ''; }
  }

  /* แยกหัวข้อ/เนื้อหาจากข้อความข่าวที่คัดลอกมาวางทั้งก้อน
     กติกาง่ายๆ: บรรทัดแรกที่ไม่ว่าง = หัวข้อ ที่เหลือ = เนื้อหา
     ถ้าบรรทัดแรกยาวเกินไป (ไม่น่าใช่หัวข้อ) ให้ตัดที่ประโยคแรกแทน */
  function parseBulkNewsText(text){
    const trimmed = (text || '').trim();
    if (!trimmed) return { title:'', summary:'' };

    const lines = trimmed.split(/\n+/).map(function(l){ return l.trim(); }).filter(Boolean);
    let title = lines[0] || '';
    let rest = lines.slice(1).join(' ').trim();

    if (title.length > 120){
      const m = title.match(/^(.{20,120}?[.!?ๆฯ])\s/);
      if (m){
        rest = (title.slice(m[1].length).trim() + ' ' + rest).trim();
        title = m[1].trim();
      } else {
        rest = (title.slice(120).trim() + ' ' + rest).trim();
        title = title.slice(0, 120).trim() + '…';
      }
    }
    return { title: title, summary: rest };
  }

  function syncImagesToSheet(it){
    // กรอง blob: URL (รูปที่อัปโหลดจากเครื่อง ใช้ได้แค่เซสชันนี้) ออกก่อน
    // sync เสมอ เพราะ URL แบบนี้จะใช้งานไม่ได้อีกแล้วถ้าเปิดหน้าใหม่/เครื่องอื่น
    const persistable = (it.images || []).filter(function(u){ return !u.startsWith('blob:'); });
    postToSheet({ action:'update', id: it.id, images: persistable });
  }

  /* ---------- add modal ---------- */
  const overlay = document.getElementById('modal-overlay');
  document.getElementById('btn-open-add').addEventListener('click', function(){
    overlay.hidden = false;
    document.getElementById('f-title').focus();
  });
  document.getElementById('btn-cancel').addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e){ if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !overlay.hidden) closeModal(); });

  let fetchedImageUrl = null;

  function setFetchStatus(text, isError){
    const el = document.getElementById('fetch-meta-status');
    el.style.display = text ? 'block' : 'none';
    el.textContent = text || '';
    el.style.color = isError ? 'var(--accent-live)' : 'var(--text-faint)';
  }

  document.getElementById('btn-fetch-meta').addEventListener('click', async function(){
    const url = document.getElementById('f-fetch-url').value.trim();
    if (!url){ setFetchStatus('กรุณาวางลิงก์ข่าวก่อน', true); return; }
    const btn = this;
    btn.disabled = true;
    setFetchStatus('กำลังดึงข้อมูล...', false);
    try {
      const meta = await fetchArticleMetaFromBackend(url);
      if (meta.title) document.getElementById('f-title').value = meta.title;
      if (meta.summary) document.getElementById('f-summary').value = meta.summary;
      document.getElementById('f-source').value = meta.siteName || hostnameOf(url);
      document.getElementById('f-url').value = url;
      fetchedImageUrl = meta.image || null;
      setFetchStatus(
        (meta.title ? '✓ ดึงข้อมูลสำเร็จ' : '⚠ ดึงได้บางส่วน กรุณาตรวจสอบและแก้ไขเอง') +
        (fetchedImageUrl ? ' (พบรูปด้วย)' : ''),
        !meta.title
      );
    } catch(err){
      setFetchStatus('ดึงข้อมูลไม่สำเร็จ: ' + err.message + ' — กรอกเองแทนได้เลย', true);
    } finally {
      btn.disabled = false;
    }
  });

  function closeModal(){
    overlay.hidden = true;
    document.getElementById('f-title').value = '';
    document.getElementById('f-summary').value = '';
    document.getElementById('f-source').value = '';
    document.getElementById('f-url').value = '';
    document.getElementById('f-fetch-url').value = '';
    document.getElementById('f-bulk-paste').value = '';
    setFetchStatus('', false);
    fetchedImageUrl = null;
  }

  document.getElementById('btn-parse-bulk').addEventListener('click', function(){
    const raw = document.getElementById('f-bulk-paste').value;
    const parsed = parseBulkNewsText(raw);
    if (!parsed.title){
      setFetchStatus('กรุณาวางข้อความข่าวก่อน', true);
      return;
    }
    document.getElementById('f-title').value = parsed.title;
    document.getElementById('f-summary').value = parsed.summary;
    setFetchStatus('✓ แยกข้อมูลแล้ว — ตรวจสอบและแก้ไขได้ตามต้องการ', false);
  });

  document.getElementById('btn-save').addEventListener('click', function(){
    const title = document.getElementById('f-title').value.trim();
    if (!title){ document.getElementById('f-title').focus(); return; }
    const category = document.getElementById('f-category').value;
    const summary = document.getElementById('f-summary').value.trim();
    const source = document.getElementById('f-source').value.trim() || 'ไม่ระบุแหล่งที่มา';
    const url = document.getElementById('f-url').value.trim();
    const images = fetchedImageUrl ? [fetchedImageUrl] : [];

    const newItem = { id:id(), category, status:'new', title, summary, source, url, images, timestamp:new Date().toISOString(), article:null };
    items.unshift(newItem);
    closeModal();
    renderAll();
    postToSheet({ action:'add', item:newItem });
  });

  /* ---------- search ---------- */
  document.getElementById('search-input').addEventListener('input', function(e){
    searchTerm = e.target.value.trim().toLowerCase();
    renderFeed();
  });

  /* ---------- init ---------- */
  function renderAll(){
    renderChips();
    renderStats();
    renderFeed();
    renderWorkspace();
  }

  initItems().then(renderAll);

})();
</script>
